registration:
  allowedDomains:
    - "cagdis.com"
    - "arvoredecomunicacao.com.br"

version: 1.3.14

cache: true

interface:
  customWelcome: 'Que pauta vamos transformar em notícia hoje?'
  modelSelect: false
  marketplace:
    use: false
  webSearch: true
  defaultPinnedTools:
    - web_search
    - execute_code

webSearch:
  searchProvider: keenable
  scraperProvider: keenable
  rerankerType: none
  safeSearch: 1
  keenableSearchOptions:
    maxResults: 5
  keenableScraperOptions:
    timeout: 15000

endpoints:
  agents:
    capabilities:
      - deferred_tools
      - execute_code
      - file_search
      - web_search
      - artifacts
      - subagents
      - actions
      - context
      - skills
      - memory
      - ask_user_question
      - tools
      - chain
      - ocr
  custom:
    - name: DeepSeek
      apiKey: '${DEEPSEEK_API_KEY}'
      baseURL: 'https://api.deepseek.com'
      models:
        default:
          - deepseek-v4-pro
        fetch: false
      titleConvo: true
      titleModel: deepseek-v4-pro
      modelDisplayLabel: ÁrvorePress IA

modelSpecs:
  enforce: true
  prioritize: true
  list:
    - name: deepseek-default
      label: ÁrvorePress IA
      default: true
      webSearch: true
      executeCode: true
      preset:
        endpoint: DeepSeek
        model: deepseek-v4-pro
        useResponsesApi: true
    - name: deepseek-chat-fallback
      label: ÁrvorePress IA
      default: false
      showInMenu: false
      webSearch: true
      executeCode: true
      preset:
        endpoint: DeepSeek
        model: deepseek-v4-pro
